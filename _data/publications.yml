- id: "hemmer2026true"
  type: "Article"
  title: "True zero-shot inference of dynamical systems preserving long-term statistics"
  authors: "Hemmer, Christoph Jürgen and Durstewitz, Daniel"
  year: "2026"
  venue: "Advances in Neural Information Processing Systems"
  link: "https://proceedings.neurips.cc/paper_files/paper/2025/hash/1419d8554191a65ea4f2d8e1057973e4-Abstract-Conference.html"
  abstract: "Complex, temporally evolving phenomena, from climate to brain activity, are governed by dynamical systems (DS). DS reconstruction (DSR) seeks to infer generative surrogate models of these from observed data, reproducing their long-term behavior. Existing DSR approaches require purpose-training for any new system observed, lacking the zero-shot and in-context inference capabilities known from LLMs. Here we introduce DynaMix, a novel multivariate ALRNN-based mixture-of-experts architecture pre-trained for DSR, the first DSR model able to generalize zero-shot to out-of-domain DS. Just from a provided context signal, without any re-training, DynaMix faithfully forecasts the long-term evolution of novel DS where existing time series (TS) foundation models, like Chronos, fail -- at a fraction of the number of parameters (0.1%) and orders of magnitude faster inference times. DynaMix outperforms TS foundation models in terms of long-term statistics, and often also short-term forecasts, even on real-world time series, like traffic or weather data, typically used for training and evaluating TS models, but not at all part of DynaMix&#039; training corpus. We illustrate some of the failure modes of TS models for DSR problems, and conclude that models built on DS principles may bear a huge potential also for advancing the TS prediction field."
  journal: "Advances in Neural Information Processing Systems"
  pages: "13497--13540"
  url: "https://proceedings.neurips.cc/paper_files/paper/2025/hash/1419d8554191a65ea4f2d8e1057973e4-Abstract-Conference.html"
  volume: "38"
- id: "brenner2025learning"
  type: "Inproceedings"
  title: "Learning Interpretable Hierarchical Dynamical Systems Models from Time Series Data"
  authors: "Manuel Brenner and Elias Weber and Georgia Koppe and Daniel Durstewitz"
  year: "2025"
  venue: "The Thirteenth International Conference on Learning Representations"
  link: "https://openreview.net/forum?id=Vp2OAxMs2s"
  abstract: "In science, we are often interested in obtaining a generative model of the underlying system dynamics from observed time series. While powerful methods for dynamical systems reconstruction (DSR) exist when data come from a single domain, how to best integrate data from multiple dynamical regimes and leverage it for generalization is still an open question. This becomes particularly important when individual time series are short, and group-level information may help to fill in for gaps in single-domain data. At the same time, averaging is not an option in DSR, as it will wipe out crucial dynamical properties (e.g., limit cycles in one domain vs. chaos in another). Hence, a framework is needed that enables to efficiently harvest group-level (multi-domain) information while retaining all single-domain dynamical characteristics. Here we provide such a hierarchical approach and showcase it on popular DSR benchmarks, as well as on neuroscientific and medical time series. In addition to faithful reconstruction of all individual dynamical regimes, our unsupervised methodology discovers common low-dimensional feature spaces in which datasets with similar dynamics cluster. The features spanning these spaces were further dynamically highly interpretable, surprisingly in often linear relation to control parameters that govern the dynamics of the underlying system. Finally, we illustrate transfer learning and generalization to new parameter regimes."
  booktitle: "The Thirteenth International Conference on Learning Representations"
  date: "2025-03-01"
  pubstate: "published"
  tppubtype: "inproceedings"
  url: "https://openreview.net/forum?id=Vp2OAxMs2s"
  urldate: "2025-02-01"
- id: "fechtelpeter2025computational"
  type: "Article"
  title: "Computational network models for forecasting and control of mental health trajectories in digital applications"
  authors: "Janik Fechtelpeter and Christian Rauschenberg and Christian Goetzl and Selina Hiller and Niklas Emonds and Silvia Krumm and Ulrich Reininghaus and Daniel Durstewitz and Georgia Koppe"
  year: "2025"
  venue: "medRxiv"
  link: "https://www.nature.com/articles/s41746-025-02252-3"
  abstract: "Ecological momentary assessments (EMA) have transformed mobile mental health by capturing real-time fluctuations in psychological states and behavior. While forecasting future states from EMA data is crucial for adaptive interventions, most current approaches to modeling the underlying psychological mechanisms rely on linear assumptions. These include common network based methods such as vector autoregression (VAR) or Kalman filtering, which assume fixed and proportional relationships among variables. However, a growing body of evidence suggests that psychological dynamics exhibit nonlinear properties raising concerns about the adequacy of linear models for both interpretation and prediction.

Here, we leverage three independent 40-day micro-randomized trials (N=145) to benchmark a spectrum of models—from naïve baselines and linear network models to autoregressive Transformers and nonlinear state-space models (SSMs) built on piecewise-linear recurrent neural networks (PLRNNs). PLRNNs provided the most accurate forecasts, including predictions of how individuals responded to interventions. Beyond superior forecasting, the PLRNN’s latent-network structure allowed us to simulate how changes in individual psychological states spread through the system. This revealed interpretable patterns of influence—highlighting central network nodes like sad or down as high-impact intervention targets based on their strong ripple effects. Critically, performance remained robust under real-time retraining constraints and varying data completeness, underscoring the practical viability of nonlinear SSMs in deployed mobile mental health systems. Our results establish PLRNN-based forecasting as a powerful, interpretable foundation for real-time, model-predictive control of digital mental health."
  date: "2025-02-01"
  journal: "medRxiv"
  publisher: "Cold Spring Harbor Laboratory Press"
  pubstate: "published"
  tppubtype: "article"
  url: "https://www.nature.com/articles/s41746-025-02252-3"
  urldate: "2025-01-02"
- id: "brenner2026data"
  type: "Article"
  title: "Data-Driven Hierarchical Digital Twins of Social Interactions"
  authors: "Brenner, Manuel and Guennouni, Ismail and Durstewitz, Daniel and NL, Stephanie and Schmidt, Stefanie Lis and Kirsch, Peter and Koppe, Georgia"
  abstract: "Social interactions are inherently complex, shaped by dynamic trust building, biases,
and adaptive strategies. Yet in laboratory settings, their study is often constrained by
small datasets that nonetheless encode rich and sophisticated cognitive processes. This
scarcity has historically limited modeling approaches to hand-tailored frameworks that
embed strong priors about the underlying mechanisms. Recent advances in data-driven
modeling of latent dynamical processes provide an alternative, extracting generative
models directly from behavioral data without restrictive assumptions. Building on
these methods, we derive hierarchical digital twins from sparse, non-Gaussian
investment sequences in repeated trust games. Our approach proceeds in three stages.
First, we demonstrate that, despite the limited data, the inferred twins can accurately
predict future investments, establishing predictive validity and providing a solid
baseline for subsequent mechanistic analyses. Second, we analyze the latent dynamics
of these models and show that they capture mechanistic structure in how investments
and choice uncertainty are organized in state space and how social versus non-social
cues are represented, in a way that parallels patterns observed directly in the empirical
behavior. Third, we exploit the generative nature of the hierarchical digital twins to
run in-silico experiments beyond the original data, such as probing how specific cues
steer participants into trusting or mistrusting states and simulating responses to novel,
unobserved cue-outcome combinations and trustee strategies. Together, this work
demonstrates how generative digital twins open a new path toward mechanistic,
data-driven accounts of social interaction dynamics that both reproduce observed
behavior and support hypothesis generation in virtual environments."
- id: "durstewitz2025neuroscience"
  type: "Article"
  title: "What Neuroscience Can Teach AI About Learning in Continuously Changing Environments"
  authors: "Daniel Durstewitz and Bruno Averbeck and Georgia Koppe"
  year: "2025"
  venue: "arXiv preprint arXiv:2507.02103"
  link: "https://www.nature.com/articles/s42256-025-01146-z"
  abstract: "Modern AI models, such as large language models, are usually trained once on a huge corpus of data, potentially fine-tuned for a specific task, and then deployed with fixed parameters. Their training is costly, slow, and gradual, requiring billions of repetitions. In stark contrast, animals continuously adapt to the ever-changing contingencies in their environments. This is particularly important for social species, where behavioral policies and reward outcomes may frequently change in interaction with peers. The underlying computational processes are often marked by rapid shifts in an animal&#039;s behaviour and rather sudden transitions in neuronal population activity. Such computational capacities are of growing importance for AI systems operating in the real world, like those guiding robots or autonomous vehicles, or for agentic AI interacting with humans online. Can AI learn from neuroscience? This Perspective explores this question, integrating the literature on continual and in-context learning in AI with the neuroscience of learning on behavioral tasks with shifting rules, reward probabilities, or outcomes. We will outline an agenda for how specifically insights from neuroscience may inform current developments in AI in this area, and - vice versa - what neuroscience may learn from AI, contributing to the evolving field of NeuroAI."
