  type: "Book"
  title: "Advanced Data Analysis in Neuroscience"
  authors: "Daniel Durstewitz"
  year: "2017"
  link: "https://link.springer.com/content/pdf/10.1007%2F978-3-319-59976-2.pdf"
  date: "2017-11-01"
  isbn: "9783319599748"
