- id: "hess2026parallel"
  type: "Article"
  title: "Parallel-in-Time Training of Recurrent Neural Networks for Dynamical Systems Reconstruction"
  authors: "Hess, Florian and Götz, Florian and Durstewitz, Daniel"
  year: "2026"
  venue: "arXiv preprint arXiv:2605.12683"
  link: "https://arxiv.org/abs/2605.12683"
  abstract: "Reconstructing nonlinear dynamical systems (DS) from data (DSR) is a fundamental challenge in science and engineering, but it inherently relies on sequential models. Recent breakthroughs for sequential models have produced algorithms that parallelize computation along sequence length  , achieving logarithmic time complexity,  . Since sequence lengths have been practically limited due to the linear runtime complexity   of classical backpropagation through time, this opens new avenues for DSR. This paper studies two prominent classes of parallel-in-time algorithms for this task, both of which leverage parallel associative scans as their core computational primitive. The first class comprises models with linear yet non-autonomous dynamics and a nonlinear readout, such as modern State Space Models (SSMs), while the second consists of general nonlinear models which can be parallelized using the DEER framework. We find that the linear training-time recurrence of the first class of models imposes limitations that often hinder learning of accurate nonlinear dynamics. To address this, we augment DEER with Generalized Teacher Forcing (GTF), a novel variant within the more general nonlinear framework that ensures stable and effective learning of nonlinear dynamics across arbitrary sequence lengths. Using GTF-DEER, we investigate the benefits of training on extremely long sequences (   ) for DSR. Our results show that access to such long trajectories significantly improves DSR if the data features long time scales. This work establishes GTF-DEER as a robust tool for data-driven discovery and underscores the largely untapped potential of long-sequence learning in modeling complex DS."
  journal: "arXiv preprint arXiv:2605.12683"
  url: "https://arxiv.org/abs/2605.12683"
- id: "herz2026teacher"
  type: "Article"
  title: "Teacher Forcing as Generalized Bayes: Optimization Geometry Mismatch in Switching Surrogates for Chaotic Dynamics"
  authors: "Herz, Andre and Durstewitz, Daniel and Koppe, Georgia"
  year: "2026"
  venue: "arXiv preprint arXiv:2604.25904"
  link: "https://arxiv.org/abs/2604.25904"
  abstract: "Identity teacher forcing (ITF) enables stable training of deterministic recurrent surrogates for chaotic dynamical systems and has been highly effective for dynamical systems reconstruction (DSR) with recurrent neural networks (RNNs), including interpretable almost-linear RNNs (AL-RNNs). However, as an intervention-based prediction loss (and thus a generalized Bayes update), teacher forcing need not match the free-running model's marginal likelihood geometry. We compare the objective-induced curvatures of ITF and marginal likelihood in a probabilistic switching augmentation of AL-RNNs, estimating ambiguity-aware observed information via Louis' identity. In the switching setting studied here, conditioning on a single forced regime path (as ITF does) inflates curvature, while marginal likelihood curvature is reduced by a missing-information correction when multiple switching explanations remain plausible. In Lorenz-63 experiments, windowed evidence fine-tuning improves held-out evidence but can degrade dynamical quantities of interest (QoIs) relative to ITF-pretrained models."
  journal: "arXiv preprint arXiv:2604.25904"
  url: "https://arxiv.org/abs/2604.25904"
- id: "cao2026dslassocov"
  type: "Article"
  title: "dsLassoCov: a federated Lasso approach incorporating covariate control"
  authors: "Cao, Han and Anguita-Ruiz, Augusto and Warembourg, Charline and Escribà-Montagut, Xavier and Vrijheid, Martine and Gonzalez, Juan R and Cadman, Tim and Setó-Llorens, Adrià and Schneider-Lindner, Verena and Durstewitz, Daniel and others"
  year: "2026"
  venue: "Scientific Reports"
  link: "https://www.nature.com/articles/s41598-026-48845-0"
  abstract: "Machine learning has been widely adopted in biomedical research, fueled by the increasing availability of data. However, integrating datasets across institutions is challenging due to legal restrictions and data governance complexities. Federated learning allows the direct, privacy preserving training of machine learning models using geographically distributed datasets, but faces the challenge of how to appropriately control for covariate effects. The naive implementation of conventional covariate control methods in federated learning scenarios is often impractical due to the substantial communication costs, particularly with high-dimensional data. To address this issue, we introduce dsLassoCov, a machine learning approach designed to control for covariate effects and allow an efficient training in federated setting. In biomedical analysis, this may support the identification of biomarker candidates while accounting for the effect of confounding. Using simulated data, we demonstrate that dsLassoCov can efficiently and effectively manage confounding effects during model training. In our real-world data analysis, we replicated a large-scale exposome analysis using data from six geographically distinct databases, achieving results consistent with previous studies. By addressing the challenge of covariate control, our proposed approach can accelerate the application of federated learning in large-scale biomedical studies."
  journal: "Scientific Reports"
  publisher: "Nature Publishing Group UK London"
  url: "https://www.nature.com/articles/s41598-026-48845-0"
- id: "cao2026multi"
  type: "Article"
  title: "A multi-task learning approach combining regression and classification tasks for joint feature selection"
  authors: "Cao, Han and Rajan, Sivanesan and Hahn, Bianka and Kocak, Ersoy and Brenner, Manuel and Hess, Florian and Schefzik, Roman and Durstewitz, Daniel and Koppe, Georgia and Schwarz, Emanuel and others"
  year: "2026"
  venue: "Scientific Reports"
  link: "https://www.nature.com/articles/s41598-026-43551-3"
  abstract: "Multi-task learning (MTL) is a learning paradigm that enables the simultaneous training of multiple communicating algorithms, and has been widely applied in the biomedical analysis for shared biomarker identification. Although MTL has successfully supported either regression or classification tasks, incorporating mixed types of tasks into a unified MTL framework remains challenging, especially in biomedicine, where it can lead to biased biomarker identification. To address this issue, we propose an improved method of multi-task learning, MTLComb, which balances the weights of regression and classification tasks to promote unbiased biomarker identification. We demonstrate the algorithmic efficiency and clinical utility of MTLComb through analyses on both simulated data and actual biomedical studies pertaining to sepsis and schizophrenia. The code is available at https://github.com/transbioZI/MTLComb."
  journal: "Scientific Reports"
  number: "1"
  pages: "12699"
  publisher: "Nature Publishing Group UK London"
  url: "https://www.nature.com/articles/s41598-026-43551-3"
  volume: "16"
- id: "yang2026normative"
  type: "Article"
  title: "A normative reference for large-scale human brain dynamics across the lifespan"
  authors: "Yang, Yanwu and Sharma, Nitin and Dai, Sicheng and Mallus, Francesco and Su, Guinan and Kand, Atharva and Zabihi, Mariam and Aln{\\ae}s, Dag and Buitelaar, Jan K and Croy, Ilona and others"
  year: "2026"
  venue: "bioRxiv"
  link: "https://www.biorxiv.org/content/10.64898/2026.03.06.710057v1.abstract"
  abstract: "Human brain function emerges from dynamic reconfigurations of large-scale neural networks. While population-level reference charts have transformed the study of static brain structure and connectivity, an equivalent normative framework for intrinsic brain dynamics has been lacking. This gap has limited our ability to characterize individual variability, development, ageing, and mental health conditions at scale. Here, we establish a population-level normative reference for large-scale human brain dynamics using resting-state fMRI data from more than 10,000 individuals spanning the lifespan and 91 scanning sites. We derive a compact set of recurring brain-state configurations that are reproducible across scanners and acquisition paradigms and that generalize to previously unseen cohorts. Anchoring these dynamic states to normative lifespan models enables the quantification of individual deviations relative to population reference distributions. We show that intrinsic brain dynamics undergo systematic reorganization across development and ageing, with pronounced changes before early adulthood and more gradual modulation thereafter. Applying this framework across multiple mental health conditions reveals disorder-specific and highly heterogeneous deviations in brain dynamics that are not captured by static neuroimaging measures. Robust transfer to independent cohorts and longitudinal analyses demonstrate that normative brain dynamics can be reliably assessed out of distribution. These results delineate a population-scale dynamic architecture of the human brain and extend normative brain mapping from static phenotypes to the temporal domain, providing a reference framework for studying brain function across the lifespan in health and disease."
  journal: "bioRxiv"
  pages: "2026--03"
  publisher: "Cold Spring Harbor Laboratory"
  url: "https://www.biorxiv.org/content/10.64898/2026.03.06.710057v1.abstract"
- id: "durstewitz2026position"
  type: "Article"
  title: "Position: Why a Dynamical Systems Perspective is Needed to Advance Time Series Modeling"
  authors: "Daniel Durstewitz and Christoph Jürgen Hemmer and Florian Hess and Charlotte Ricarda Doll and Lukas Eisenmann"
  year: "2026"
  venue: "arXiv preprint arXiv:2602.16864"
  link: "https://arxiv.org/abs/2602.16864"
  abstract: "Time series (TS) modeling has come a long way from early statistical, mainly linear, approaches to the current trend in TS foundation models. With a lot of hype and industrial demand in this field, it is not always clear how much progress there really is. To advance TS forecasting and analysis to the next level, here we argue that the field needs a dynamical systems (DS) perspective. TS of observations from natural or engineered systems almost always originate from some underlying DS, and arguably access to its governing equations would yield theoretically optimal forecasts. This is the promise of DS reconstruction (DSR), a class of ML/AI approaches that aim to infer surrogate models of the underlying DS from data. But models based on DS principles offer other profound advantages: Beyond short-term forecasts, they enable to predict the long-term statistics of an observed system, which in many practical scenarios may be the more relevant quantities. DS theory furthermore provides domain-independent theoretical insight into mechanisms underlying TS generation, and thereby will inform us, e.g., about upper bounds on performance of any TS model, generalization into unseen regimes as in tipping points, or potential control strategies. After reviewing some of the central concepts, methods, measures, and models in DS theory and DSR, we will discuss how insights from this field can advance TS modeling in crucial ways, enabling better forecasting with much lower computational and memory footprints. We conclude with a number of specific suggestions for translating insights from DSR into TS modeling.}
