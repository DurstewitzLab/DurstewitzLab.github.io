  title: "Decoding the sequential contributions of hippocampal-prefrontal neuronal assemblies to spatial working memory"
  authors: "Michal T Kucewicz and Michal T Kucewicz and Daniel Durstewitz and Mark D Tricklebank and Matt Jones and Mark Laubach and Shigeyoshi Fujisawa and Cyriel Pennartz and Matthew Shapiro and Robert Hampson and Samuel Deadwyler"
